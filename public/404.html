<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Gene Dai</title>
  <meta name="robots" content="noindex" />
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="/app.js?v=236bdcb7be" defer></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f2f1ed, #1a1915);
      --surface: light-dark(#ebeae5, #28271f);
      --white: light-dark(#ffffff, #23221d);
      --text-primary: light-dark(#26251e, #ecebe5);
      --text-secondary: light-dark(rgba(38, 37, 30, 0.75), rgba(236, 235, 229, 0.72));
      --text-tertiary: light-dark(rgba(38, 37, 30, 0.68), rgba(236, 235, 229, 0.58));
      --border-default: light-dark(rgba(38, 37, 30, 0.1), rgba(236, 235, 229, 0.12));
      --border-medium: light-dark(rgba(38, 37, 30, 0.2), rgba(236, 235, 229, 0.22));
      --accent: light-dark(#bd3f00, #ff8a4c);
      --shadow-card: rgba(0,0,0,0.14) 0px 28px 70px 0px, rgba(0,0,0,0.1) 0px 14px 32px 0px;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    body {
      font-family: var(--font-sans);
      background: var(--bg); color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px; box-sizing: border-box;
    }
    .wrap { max-width: 420px; width: 100%; }
    .code { font: 13px var(--font-mono); color: var(--text-tertiary); margin: 0 0 8px; }
    h1 { font-size: 36px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.5px; }
    p { color: var(--text-secondary); margin: 0 0 24px; line-height: 1.6; }
    ul { list-style: none; padding: 0; margin: 0 0 24px; border-top: 1px solid var(--border-default); }
    li { padding: 10px 0; border-bottom: 1px solid var(--border-default); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    kbd {
      font-family: var(--font-mono); font-size: 12px; padding: 1px 6px;
      border: 1px solid var(--border-medium); border-radius: 4px; background: var(--surface);
    }
    .js-hint { display: none; }
    .js .js-hint { display: block; }
    /* Command menu (shared markup from app.js) */
    .palette {
      width: min(560px, calc(100vw - 32px)); margin: 12vh auto auto; padding: 0;
      border: none; border-radius: 10px; background: var(--white);
      box-shadow: var(--shadow-card); color: var(--text-primary);
    }
    .palette::backdrop { background: rgba(38, 37, 30, 0.35); }
    .palette input {
      width: 100%; box-sizing: border-box; padding: 16px 18px; border: none; outline: none;
      border-bottom: 1px solid var(--border-default); background: transparent;
      font: 15px var(--font-mono); color: var(--text-primary);
    }
    .palette ul { max-height: 50vh; overflow-y: auto; padding: 6px; margin: 0; border: none; }
    .palette li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .palette li::before { content: none; }
    .palette li .hint { font-size: 11px; color: var(--text-secondary); }
    .palette li[aria-selected="true"] { background: var(--surface); }
    .palette .empty { padding: 14px 18px; font-size: 13px; color: var(--text-tertiary); }
    .palette .foot { padding: 8px 14px; border-top: 1px solid var(--border-default); font-size: 11px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>This page doesn&rsquo;t exist or has moved.</p>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/#writing">Writing</a></li>
      <li><a href="/#connect">Contact</a></li>
    </ul>
    <p lang="zh-CN">页面不存在。<a href="/zh/">回到中文首页 →</a></p>
    <p class="js-hint">Or press <kbd>⌘K</kbd> (<kbd>Ctrl K</kbd> on Windows) to search.</p>
  </main>
</body>
</html>
