<!DOCTYPE html>
<!--
  Source for public/og-image.png (1200x630). Regenerate with a headless browser:
    agent-browser open "file://$PWD/scripts/og.html"
    agent-browser set viewport 1200 630
    agent-browser screenshot public/og-image.png
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 300 600; src: url(../public/fonts/inter.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 500; src: url(../public/fonts/jetbrains-mono.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-weight: 400 600; src: url(../public/fonts/source-serif-4.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f2f1ed; color: #26251e; font-family: 'Inter', sans-serif;
    padding: 64px 80px; display: flex; flex-direction: column; position: relative;
  }
  .bar {
    position: absolute; top: 0; left: 0; right: 0; height: 52px;
    border-bottom: 1px solid rgba(38,37,30,0.1);
    display: flex; align-items: center; padding: 0 80px;
    font: 18px 'JetBrains Mono', monospace; color: rgba(38,37,30,0.68);
  }
  .bar b { color: #26251e; font-weight: 500; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 44px; }
  pre { font: 21px/1.65 'JetBrains Mono', monospace; color: rgba(38,37,30,0.75); }
  .k { color: #17704f; }
  .f { color: rgba(38,37,30,0.5); }
  img { width: 132px; height: 132px; border-radius: 50%; border: 1px solid rgba(38,37,30,0.2); }
  h1 { font-size: 88px; font-weight: 400; letter-spacing: -2.5px; margin-top: 26px; line-height: 1; }
  h1 span { font: 400 64px 'JetBrains Mono', monospace; color: rgba(38,37,30,0.35); margin-right: 22px; vertical-align: 6px; }
  p { font: 28px/1.4 'Source Serif 4', serif; color: rgba(38,37,30,0.75); margin-top: 22px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 52px; display: flex; justify-content: space-between; font: 19px 'JetBrains Mono', monospace; color: rgba(38,37,30,0.68); border-top: 1px solid rgba(38,37,30,0.1); padding-top: 22px; }
  p b { font-weight: 400; color: #bd3f00; border-bottom: 2px solid #bd3f00; }
</style>
</head>
<body>
  <div class="bar">~/<b>genedai.md</b></div>
  <div class="top">
    <pre><span class="f">---</span>
<span class="k">role</span>: Co-Founder &amp; CPO @ Metix AI
<span class="k">prev</span>: BOSS Zhipin · Liepin · Zuoyebang
<span class="k">location</span>: California
<span class="f">---</span></pre>
    <img src="../public/avatar.jpg" alt="">
  </div>
  <h1><span>#</span>Gene Dai</h1>
  <p>Product builder, co-founding <b>Metix AI</b>, an AI-native hiring platform.</p>
  <div class="foot"><span>AI hiring · product · HRTech</span><span>x.com/genedai · hi@genedai.me</span></div>
</body>
</html>
