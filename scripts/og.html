<!DOCTYPE html>
<!--
  Source for public/og-image.png (1200x630). Regenerate with a headless browser:
    agent-browser open "file://$PWD/scripts/og.html"
    agent-browser set viewport 1200 630
    agent-browser screenshot public/og-image.png
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 300 600; src: url(../public/fonts/inter.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 500; src: url(../public/fonts/jetbrains-mono.woff2) format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-weight: 400 600; src: url(../public/fonts/source-serif-4.woff2) format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f2f1ed; color: #26251e; font-family: 'Inter', sans-serif;
    padding: 64px 80px; display: flex; flex-direction: column; position: relative;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 8px; }
  .meta { font-size: 24px; line-height: 1.6; color: rgba(38,37,30,0.72); }
  .meta strong { display: block; font-weight: 600; color: #26251e; font-size: 26px; }
  img { width: 132px; height: 132px; border-radius: 50%; border: 1px solid rgba(38,37,30,0.2); }
  h1 { font-size: 92px; font-weight: 400; letter-spacing: -2.5px; margin-top: 34px; line-height: 1; }
  h1 span { font: 400 64px 'JetBrains Mono', monospace; color: rgba(38,37,30,0.35); margin-right: 22px; vertical-align: 8px; }
  p { font: 30px/1.4 'Source Serif 4', serif; color: rgba(38,37,30,0.78); margin-top: 24px; max-width: 980px; }
  p b { font-weight: 400; color: #bd3f00; border-bottom: 2px solid #bd3f00; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 52px; display: flex; justify-content: space-between; font-size: 22px; color: rgba(38,37,30,0.68); border-top: 1px solid rgba(38,37,30,0.1); padding-top: 22px; }
  .foot b { font-weight: 600; color: #26251e; }
</style>
</head>
<body>
  <div class="top">
    <div class="meta"><strong>Co-Founder &amp; CPO, Metix AI</strong>Previously BOSS Zhipin · Liepin · Zuoyebang<br>California</div>
    <img src="../public/avatar.jpg" alt="">
  </div>
  <h1><span>#</span>Gene Dai</h1>
  <p>I build hiring products. Now co-founding <b>Metix AI</b>, an AI-native hiring platform.</p>
  <div class="foot"><b>genedai.md</b><span>hi@genedai.me</span></div>
</body>
</html>
