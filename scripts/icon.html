<!DOCTYPE html>
<!--
  Source for the PNG icons. Regenerate:
    agent-browser open "file://$PWD/scripts/icon.html"
    agent-browser set viewport 512 512
    agent-browser screenshot public/icon-512.png
    sips -z 192 192 public/icon-512.png --out public/icon-192.png
    sips -z 180 180 public/icon-512.png --out public/apple-touch-icon.png
    sips -z 32 32 public/icon-512.png --out public/favicon-32.png
  Square and full-bleed: iOS and Android round the corners themselves.
  public/favicon.svg is the same mark as vector.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 300 700; src: url(../public/fonts/inter.woff2) format('woff2'); }
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body { background: #26251e; color: #f2f1ed; display: flex; align-items: center; justify-content: center;
    font: 600 236px/1 'Inter', sans-serif; letter-spacing: -10px; }
  span { transform: translate(-5px, -6px); }
</style>
</head>
<body><span>GD</span></body>
</html>
